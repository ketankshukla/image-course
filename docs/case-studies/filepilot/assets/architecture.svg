<g><rect x="660" y="140" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="682" y="180" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">Coordinator + contracts</text><text x="682" y="221" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Authenticate and validate</text><text x="682" y="253" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Route requests; own job state</text></g>
<g><rect x="40" y="350" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="62" y="390" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">P1  Explorer / MCP</text><text x="62" y="431" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Read permitted root</text><text x="62" y="463" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Inventory and bounded previews</text></g>
<g><rect x="660" y="350" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="682" y="390" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">P2 + P3  Finder / planner</text><text x="682" y="431" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">RAG evidence → proposed plan</text><text x="682" y="463" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Optional A2A specialists: no writes</text></g>
