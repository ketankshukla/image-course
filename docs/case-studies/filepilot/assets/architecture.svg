<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">One local system. One authorized writer.</title><desc id="desc">Read tools and suggestions cannot bypass the approval boundary. P1 supplies file evidence to P4. P4 must independently recheck every operation.</desc>
