<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Keep personal files on the personal computer</title><desc id="desc">Deploying a website does not deploy access to someone's local drive. No arrow crosses from public hosting into local files. Remote inference is a separate opt-in.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#245ac4" stroke-width="2"/></marker></defs>
<rect width="1200" height="860" rx="24" fill="#f5f8ff"/><rect width="1200" height="112" rx="24" fill="#0c294f"/>
<text x="36" y="48" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700" fill="white">Keep personal files on the personal computer</text>
<text x="36" y="86" font-family="Segoe UI, sans-serif" font-size="22" fill="#dbe8ff">Deploying a website does not deploy access to someone's local drive.</text>
<path d="M290 290 L290 350" stroke="#245ac4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M290 500 L290 560" stroke="#245ac4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M910 290 L910 350" stroke="#245ac4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<g><rect x="40" y="140" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="62" y="180" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">LOCAL  Browser workspace</text><text x="62" y="221" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Same-origin local UI / API</text><text x="62" y="253" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Session, Origin and Host checks</text></g>
<g><rect x="40" y="350" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="62" y="390" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">LOCAL  Python service</text><text x="62" y="431" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Bounded read and write rules</text><text x="62" y="463" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">No administrative privileges</text></g>
<g><rect x="40" y="560" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="62" y="600" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">LOCAL  Files + separate state</text><text x="62" y="641" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Sandbox files; separate private index</text><text x="62" y="673" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Plans and journal outside sandbox</text></g>
<g><rect x="660" y="140" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="682" y="180" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">PUBLIC  Course library</text><text x="682" y="221" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Published teaching documents</text><text x="682" y="253" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">No filesystem connection</text></g>
<g><rect x="660" y="350" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="682" y="390" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">PUBLIC  Synthetic demo</text><text x="682" y="431" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Fictional records only</text><text x="682" y="463" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">No upload or personal-drive bridge</text></g>
<g><rect x="660" y="560" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="682" y="600" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">LATER  Optional remote model</text><text x="682" y="641" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Off by default</text><text x="682" y="673" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Explicit content-transfer approval</text></g>
<rect x="36" y="750" width="1128" height="76" rx="12" fill="#e2edff"/><text x="56" y="796" font-family="Segoe UI, sans-serif" font-size="22" fill="#12366b">No arrow crosses from public hosting into local files. Remote inference is a separate opt-in.</text></svg>
