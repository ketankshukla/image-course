<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Crash recovery is a state machine</title><desc id="desc">The journal and filesystem are separate systems. Reconcile them. Undo is a new approved reverse plan. A collision or changed file blocks reversal.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#245ac4" stroke-width="2"/></marker></defs>
<rect width="1200" height="860" rx="24" fill="#f5f8ff"/><rect width="1200" height="112" rx="24" fill="#0c294f"/>
<text x="36" y="48" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700" fill="white">Crash recovery is a state machine</text>
<text x="36" y="86" font-family="Segoe UI, sans-serif" font-size="22" fill="#dbe8ff">The journal and filesystem are separate systems. Reconcile them.</text>
<path d="M540 220 L660 220" stroke="#245ac4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M910 290 L910 350" stroke="#245ac4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M660 430 L540 430" stroke="#245ac4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M200 500 L200 560" stroke="#245ac4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M540 480 L790 560" stroke="#245ac4" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<g><rect x="40" y="140" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="62" y="180" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">APPROVED</text><text x="62" y="221" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Revision + root grant + expiry</text><text x="62" y="253" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Exact operations authorized</text></g>
<g><rect x="660" y="140" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="682" y="180" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">PRECHECKED</text><text x="682" y="221" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Source still matches; target vacant</text><text x="682" y="253" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Commit intent before mutation</text></g>
<g><rect x="660" y="350" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="682" y="390" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">EXECUTING</text><text x="682" y="431" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">One same-volume move attempt</text><text x="682" y="463" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Crash may leave outcome unknown</text></g>
<g><rect x="40" y="350" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="62" y="390" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">RECONCILING</text><text x="62" y="431" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Inspect source and destination</text><text x="62" y="463" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Never retry an unknown result blind</text></g>
<g><rect x="40" y="560" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="62" y="600" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">VERIFIED</text><text x="62" y="641" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Expected destination identity found</text><text x="62" y="673" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Record completion; invalidate index</text></g>
<g><rect x="660" y="560" width="500" height="150" rx="16" fill="white" stroke="#b6ccef" stroke-width="2"/><text x="682" y="600" font-family="Segoe UI, sans-serif" font-weight="700" font-size="26" fill="#12366b">NEEDS REVIEW</text><text x="682" y="641" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Both / neither / changed identity</text><text x="682" y="673" font-family="Segoe UI, sans-serif" font-size="23" fill="#19283c">Preserve files; do not overwrite</text></g>
<rect x="36" y="750" width="1128" height="76" rx="12" fill="#e2edff"/><text x="56" y="796" font-family="Segoe UI, sans-serif" font-size="22" fill="#12366b">Undo is a new approved reverse plan. A collision or changed file blocks reversal.</text></svg>

