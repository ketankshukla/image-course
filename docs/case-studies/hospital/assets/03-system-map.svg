<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">Five projects, one privacy boundary</title><desc id="desc">All projects share deterministic policy contracts; only the release service dispatches packets.</desc><rect width="1440" height="620" rx="24" fill="#09162b"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="68" font-size="18" fill="#50c8dd" letter-spacing="3">HARBORCARE · SYNTHETIC LEARNING CASE</text><text x="60" y="130" font-size="43" fill="white" font-weight="700">Five projects, one privacy boundary</text><rect x="60" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="80" y="232" fill="#77e2cc" font-size="20" font-weight="700">P5  WORKSPACE</text><text x="80" y="286" font-size="18" fill="#edf5ff">Reviewer sees safe projection</text><text x="80" y="340" font-size="18" fill="#edf5ff">Server verifies each request</text><text x="80" y="394" font-size="18" fill="#edf5ff">Browser never gets full chart</text><path d="M 374 320 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#50c8dd" stroke-width="3"/><rect x="400" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="420" y="232" fill="#77e2cc" font-size="20" font-weight="700">P1 + P2  EVIDENCE</text><text x="420" y="286" font-size="18" fill="#edf5ff">MCP controls tool access</text><text x="420" y="340" font-size="18" fill="#edf5ff">RAG scopes retrieval first</text><text x="420" y="394" font-size="18" fill="#edf5ff">Policy decides, not the model</text><path d="M 714 320 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#50c8dd" stroke-width="3"/><rect x="740" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="760" y="232" fill="#77e2cc" font-size="20" font-weight="700">P3  COORDINATION</text><text x="760" y="286" font-size="18" fill="#edf5ff">Scheduling / claims / transport</text><text x="760" y="340" font-size="18" fill="#edf5ff">Bounded A2A task envelopes</text><text x="760" y="394" font-size="18" fill="#edf5ff">No copied full conversation</text><path d="M 1054 320 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#50c8dd" stroke-width="3"/><rect x="1080" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="1100" y="232" fill="#77e2cc" font-size="20" font-weight="700">P4  DISCLOSURE</text><text x="1100" y="286" font-size="18" fill="#edf5ff">Exact packet + human approval</text><text x="1100" y="340" font-size="18" fill="#edf5ff">Outbox + final dispatch check</text><text x="1100" y="394" font-size="18" fill="#edf5ff">Local recipient simulator</text><rect x="60" y="492" width="1320" height="76" rx="12" fill="#19384a"/><text x="84" y="537" font-size="20" fill="#e8fcff">All projects share deterministic policy contracts; only the release service dispatches packets.</text></g></svg>
