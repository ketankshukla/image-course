<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">Approval is not delivery</title><desc id="desc">Revocation blocks future authorization; it cannot recall bytes already sent. Never retry blindly.</desc><rect width="1440" height="620" rx="24" fill="#09162b"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="68" font-size="18" fill="#50c8dd" letter-spacing="3">HARBORCARE · SYNTHETIC LEARNING CASE</text><text x="60" y="130" font-size="43" fill="white" font-weight="700">Approval is not delivery</text><rect x="60" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="80" y="232" fill="#77e2cc" font-size="20" font-weight="700">PREVIEW</text><text x="80" y="286" font-size="18" fill="#edf5ff">Create allowlisted packet</text><text x="80" y="340" font-size="18" fill="#edf5ff">Calculate stable digest</text><text x="80" y="394" font-size="18" fill="#edf5ff">No transmission yet</text><path d="M 374 320 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#50c8dd" stroke-width="3"/><rect x="400" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="420" y="232" fill="#77e2cc" font-size="20" font-weight="700">APPROVED / QUEUED</text><text x="420" y="286" font-size="18" fill="#edf5ff">Review exact recipient + fields</text><text x="420" y="340" font-size="18" fill="#edf5ff">Store release and outbox</text><text x="420" y="394" font-size="18" fill="#edf5ff">Changes require new review</text><path d="M 714 320 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#50c8dd" stroke-width="3"/><rect x="740" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="760" y="232" fill="#77e2cc" font-size="20" font-weight="700">IN FLIGHT</text><text x="760" y="286" font-size="18" fill="#edf5ff">Lock and check current policy</text><text x="760" y="340" font-size="18" fill="#edf5ff">Mark dispatch attempt</text><text x="760" y="394" font-size="18" fill="#edf5ff">Network is a separate boundary</text><path d="M 1054 320 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#50c8dd" stroke-width="3"/><rect x="1080" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="1100" y="232" fill="#77e2cc" font-size="20" font-weight="700">RECONCILE</text><text x="1100" y="286" font-size="18" fill="#edf5ff">Receipt: delivered</text><text x="1100" y="340" font-size="18" fill="#edf5ff">No receipt: status unknown</text><text x="1100" y="394" font-size="18" fill="#edf5ff">Query status before any retry</text><rect x="60" y="492" width="1320" height="76" rx="12" fill="#19384a"/><text x="84" y="537" font-size="20" fill="#e8fcff">Revocation blocks future authorization; it cannot recall bytes already sent. Never retry blindly.</text></g></svg>
