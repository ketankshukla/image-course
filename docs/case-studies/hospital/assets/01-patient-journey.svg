<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">One discharge, different information</title><desc id="desc">Private information does not become public just because one recipient may receive it.</desc><rect width="1440" height="620" rx="24" fill="#09162b"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="68" font-size="18" fill="#50c8dd" letter-spacing="3">HARBORCARE · SYNTHETIC LEARNING CASE</text><text x="60" y="130" font-size="43" fill="white" font-weight="700">One discharge, different information</text><rect x="60" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="80" y="232" fill="#77e2cc" font-size="20" font-weight="700">1  VERIFY</text><text x="80" y="286" font-size="18" fill="#edf5ff">Authenticate the requester</text><text x="80" y="340" font-size="18" fill="#edf5ff">Confirm patient + encounter</text><text x="80" y="394" font-size="18" fill="#edf5ff">Check current assignment</text><path d="M 374 320 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#50c8dd" stroke-width="3"/><rect x="400" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="420" y="232" fill="#77e2cc" font-size="20" font-weight="700">2  PREPARE</text><text x="420" y="286" font-size="18" fill="#edf5ff">Read only permitted evidence</text><text x="420" y="340" font-size="18" fill="#edf5ff">Separate public information</text><text x="420" y="394" font-size="18" fill="#edf5ff">Build recipient-specific packet</text><path d="M 714 320 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#50c8dd" stroke-width="3"/><rect x="740" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="760" y="232" fill="#77e2cc" font-size="20" font-weight="700">3  REVIEW</text><text x="760" y="286" font-size="18" fill="#edf5ff">Show exact fields + recipient</text><text x="760" y="340" font-size="18" fill="#edf5ff">Bind approval to packet digest</text><text x="760" y="394" font-size="18" fill="#edf5ff">Record purpose and expiry</text><path d="M 1054 320 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#50c8dd" stroke-width="3"/><rect x="1080" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="1100" y="232" fill="#77e2cc" font-size="20" font-weight="700">4  RELEASE</text><text x="1100" y="286" font-size="18" fill="#edf5ff">Recheck current authorization</text><text x="1100" y="340" font-size="18" fill="#edf5ff">Send to test receiver only</text><text x="1100" y="394" font-size="18" fill="#edf5ff">Record receipt or uncertainty</text><rect x="60" y="492" width="1320" height="76" rx="12" fill="#19384a"/><text x="84" y="537" font-size="20" fill="#e8fcff">Private information does not become public just because one recipient may receive it.</text></g></svg>
