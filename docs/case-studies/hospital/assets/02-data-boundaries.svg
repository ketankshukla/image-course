<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">Permission follows the data</title><desc id="desc">Unassigned agency: deny. Restricted records: no automated external release in this demo.</desc><rect width="1440" height="620" rx="24" fill="#09162b"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="68" font-size="18" fill="#50c8dd" letter-spacing="3">HARBORCARE · SYNTHETIC LEARNING CASE</text><text x="60" y="130" font-size="43" fill="white" font-weight="700">Permission follows the data</text><rect x="60" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="80" y="232" fill="#77e2cc" font-size="20" font-weight="700">PUBLIC</text><text x="80" y="286" font-size="18" fill="#edf5ff">Curated service information</text><text x="80" y="340" font-size="18" fill="#edf5ff">Opening hours and directions</text><text x="80" y="394" font-size="18" fill="#edf5ff">No patient existence lookup</text><rect x="400" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="420" y="232" fill="#77e2cc" font-size="20" font-weight="700">CARE TEAM</text><text x="420" y="286" font-size="18" fill="#edf5ff">Assigned encounter only</text><text x="420" y="340" font-size="18" fill="#edf5ff">Relevant clinical information</text><text x="420" y="394" font-size="18" fill="#edf5ff">No hospital-wide browsing</text><rect x="740" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="760" y="232" fill="#77e2cc" font-size="20" font-weight="700">INSURER</text><text x="760" y="286" font-size="18" fill="#edf5ff">Approved claim fields only</text><text x="760" y="340" font-size="18" fill="#edf5ff">Verified organization + task</text><text x="760" y="394" font-size="18" fill="#edf5ff">Not a complete patient chart</text><rect x="1080" y="190" width="310" height="260" rx="16" fill="#112e4d" stroke="#315572"/><text x="1100" y="232" fill="#77e2cc" font-size="20" font-weight="700">TRANSPORT</text><text x="1100" y="286" font-size="18" fill="#edf5ff">Pickup alias, place and time</text><text x="1100" y="340" font-size="18" fill="#edf5ff">Destination + needed assistance</text><text x="1100" y="394" font-size="18" fill="#edf5ff">No diagnoses or medications</text><rect x="60" y="492" width="1320" height="76" rx="12" fill="#19384a"/><text x="84" y="537" font-size="20" fill="#e8fcff">Unassigned agency: deny. Restricted records: no automated external release in this demo.</text></g></svg>
