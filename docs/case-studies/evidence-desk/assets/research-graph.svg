<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Coordinate independent work, then review it.</title><desc id="desc">Each branch returns a typed result; required failures remain visible.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#3b82c4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#f4f9ff"/><text x="50" y="65" fill="#123b66" font-family="Arial,sans-serif" font-size="34" font-weight="700">Coordinate independent work, then review it.</text><text x="50" y="105" fill="#456581" font-family="Arial,sans-serif" font-size="21">Each branch returns a typed result; required failures remain visible.</text><path d="M215 300V410" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 300V355H215V410" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M985 300V355H215" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 500H425" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 500H810" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M985 580V630H600V590" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="160" width="330" height="140" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="160" width="7" height="140" rx="3" fill="#2074b8"/><text x="72" y="196" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Cost research</text><text x="72" y="232" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Prices and calculations</text><text x="72" y="261" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Units, dates, assumptions</text><rect x="435" y="160" width="330" height="140" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="435" y="160" width="7" height="140" rx="3" fill="#2074b8"/><text x="457" y="196" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Capability research</text><text x="457" y="232" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Feature evidence</text><text x="457" y="261" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Unknowns and conflicts</text><rect x="820" y="160" width="330" height="140" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="820" y="160" width="7" height="140" rx="3" fill="#2074b8"/><text x="842" y="196" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Requirements</text><text x="842" y="232" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Team constraints</text><text x="842" y="261" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Must-haves and tradeoffs</text><rect x="50" y="420" width="330" height="160" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="420" width="7" height="160" rx="3" fill="#2074b8"/><text x="72" y="456" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Merge</text><text x="72" y="492" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Wait for required results</text><text x="72" y="521" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Preserve disagreements</text><text x="72" y="550" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Mark partial work</text><rect x="435" y="420" width="330" height="160" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="435" y="420" width="7" height="160" rx="3" fill="#2074b8"/><text x="457" y="456" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Writer</text><text x="457" y="492" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Use merged packet</text><text x="457" y="521" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Produce draft claims</text><text x="457" y="550" fill="#29465e" font-family="Arial,sans-serif" font-size="21">No automatic approval</text><rect x="820" y="420" width="330" height="160" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="820" y="420" width="7" height="160" rx="3" fill="#2074b8"/><text x="842" y="456" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Critic + checks</text><text x="842" y="492" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Verify support and scope</text><text x="842" y="521" fill="#29465e" font-family="Arial,sans-serif" font-size="21">At most two revisions</text><text x="842" y="550" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Then human review</text><rect x="50" y="670" width="1100" height="58" rx="12" fill="#dfedfb"/><text x="72" y="707" fill="#164c7b" font-family="Arial,sans-serif" font-size="22">A graph can contain cycles. Multiple nodes do not require multiple autonomous agents.</text></svg>
