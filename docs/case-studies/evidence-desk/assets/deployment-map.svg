<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Release the same application in isolated environments.</title><desc id="desc">One repository does not mean one process or shared production data.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#3b82c4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#f4f9ff"/><text x="50" y="65" fill="#123b66" font-family="Arial,sans-serif" font-size="34" font-weight="700">Release the same application in isolated environments.</text><text x="50" y="105" fill="#456581" font-family="Arial,sans-serif" font-size="21">One repository does not mean one process or shared production data.</text><path d="M380 265H425" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 265H810" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 350V450" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="180" width="330" height="170" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="180" width="7" height="170" rx="3" fill="#2074b8"/><text x="72" y="216" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Pull request</text><text x="72" y="252" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Frontend and Python checks</text><text x="72" y="281" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Contract and failure tests</text><text x="72" y="310" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Required reviewer</text><rect x="435" y="180" width="330" height="170" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="435" y="180" width="7" height="170" rx="3" fill="#2074b8"/><text x="457" y="216" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Staging</text><text x="457" y="252" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Vercel frontend</text><text x="457" y="281" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Python API + worker</text><text x="457" y="310" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Separate database + secrets</text><rect x="820" y="180" width="330" height="170" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="820" y="180" width="7" height="170" rx="3" fill="#2074b8"/><text x="842" y="216" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Production</text><text x="842" y="252" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Explicit release approval</text><text x="842" y="281" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Compatible migrations</text><text x="842" y="310" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Health checks + rollback</text><rect x="260" y="460" width="680" height="150" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="260" y="460" width="7" height="150" rx="3" fill="#2074b8"/><text x="282" y="496" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Release evidence</text><text x="282" y="532" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Stale approvals rejected; restricted evidence excluded.</text><text x="282" y="561" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Worker restart tested; measured limitations recorded.</text><rect x="50" y="670" width="1100" height="58" rx="12" fill="#dfedfb"/><text x="72" y="707" fill="#164c7b" font-family="Arial,sans-serif" font-size="22">A successful build is not proof that a feature is complete or safe.</text></svg>
