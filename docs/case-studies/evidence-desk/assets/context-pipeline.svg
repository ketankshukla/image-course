<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Build an authorized evidence packet.</title><desc id="desc">Filtering happens before evidence enters the model.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#3b82c4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#f4f9ff"/><text x="50" y="65" fill="#123b66" font-family="Arial,sans-serif" font-size="34" font-weight="700">Build an authorized evidence packet.</text><text x="50" y="105" fill="#456581" font-family="Arial,sans-serif" font-size="21">Filtering happens before evidence enters the model.</text><path d="M380 260H425" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 260H810" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M985 340V400H600V445" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="180" width="330" height="160" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="180" width="7" height="160" rx="3" fill="#2074b8"/><text x="72" y="216" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">1  Permission</text><text x="72" y="252" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Authenticated workspace</text><text x="72" y="281" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Allowed source records</text><text x="72" y="310" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Exclude restricted quote</text><rect x="435" y="180" width="330" height="160" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="435" y="180" width="7" height="160" rx="3" fill="#2074b8"/><text x="457" y="216" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">2  Freshness</text><text x="457" y="252" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Version and effective date</text><text x="457" y="281" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Preserve real conflicts</text><text x="457" y="310" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Exclude superseded price</text><rect x="820" y="180" width="330" height="160" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="820" y="180" width="7" height="160" rx="3" fill="#2074b8"/><text x="842" y="216" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">3  Relevance</text><text x="842" y="252" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Question-focused excerpts</text><text x="842" y="281" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Keep qualifying sentences</text><text x="842" y="310" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Rank; do not guess truth</text><rect x="260" y="455" width="680" height="150" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="260" y="455" width="7" height="150" rx="3" fill="#2074b8"/><text x="282" y="491" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">4  Packet and provenance</text><text x="282" y="527" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Source IDs + excerpts + version + token budget</text><text x="282" y="556" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Only this selected packet reaches the model.</text><rect x="50" y="670" width="1100" height="58" rx="12" fill="#dfedfb"/><text x="72" y="707" fill="#164c7b" font-family="Arial,sans-serif" font-size="22">Relevant does not mean authorized. Similar does not mean true.</text></svg>
