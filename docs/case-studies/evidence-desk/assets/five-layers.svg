<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Five responsibilities. One understandable system.</title><desc id="desc">Each layer answers a different question; none replaces the others.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#3b82c4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#f4f9ff"/><text x="50" y="65" fill="#123b66" font-family="Arial,sans-serif" font-size="34" font-weight="700">Five responsibilities. One understandable system.</text><text x="50" y="105" fill="#456581" font-family="Arial,sans-serif" font-size="21">Each layer answers a different question; none replaces the others.</text><rect x="50" y="155" width="520" height="130" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="155" width="7" height="130" rx="3" fill="#2074b8"/><text x="72" y="191" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">1  Prompt</text><text x="72" y="227" fill="#29465e" font-family="Arial,sans-serif" font-size="21">What is the assignment?</text><text x="72" y="256" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Instructions, examples, output contract</text><rect x="630" y="155" width="520" height="130" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="630" y="155" width="7" height="130" rx="3" fill="#2074b8"/><text x="652" y="191" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">2  Context</text><text x="652" y="227" fill="#29465e" font-family="Arial,sans-serif" font-size="21">What evidence may it use?</text><text x="652" y="256" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Permission, relevance, freshness</text><rect x="50" y="325" width="520" height="130" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="325" width="7" height="130" rx="3" fill="#2074b8"/><text x="72" y="361" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">3  Harness</text><text x="72" y="397" fill="#29465e" font-family="Arial,sans-serif" font-size="21">What actions are allowed?</text><text x="72" y="426" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Tools, validation, records, isolation</text><rect x="630" y="325" width="520" height="130" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="630" y="325" width="7" height="130" rx="3" fill="#2074b8"/><text x="652" y="361" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">4  Loop</text><text x="652" y="397" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Continue, pause, or stop?</text><text x="652" y="426" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Checker, limits, cancellation, recovery</text><rect x="280" y="500" width="640" height="130" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="280" y="500" width="7" height="130" rx="3" fill="#2074b8"/><text x="302" y="536" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">5  Graph</text><text x="302" y="572" fill="#29465e" font-family="Arial,sans-serif" font-size="21">What depends on what?</text><text x="302" y="601" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Parallel research, join, writer, critic</text><rect x="50" y="670" width="1100" height="58" rx="12" fill="#dfedfb"/><text x="72" y="707" fill="#164c7b" font-family="Arial,sans-serif" font-size="22">EvidenceDesk combines all five to produce a reviewable, evidence-backed brief.</text></svg>
