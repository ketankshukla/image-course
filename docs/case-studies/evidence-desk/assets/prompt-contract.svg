<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">A clear assignment still needs a checker.</title><desc id="desc">The model proposes; your application validates.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#3b82c4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#f4f9ff"/><text x="50" y="65" fill="#123b66" font-family="Arial,sans-serif" font-size="34" font-weight="700">A clear assignment still needs a checker.</text><text x="50" y="105" fill="#456581" font-family="Arial,sans-serif" font-size="21">The model proposes; your application validates.</text><path d="M380 290H425" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 290H810" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M985 380V435H600V460" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="200" width="330" height="180" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="200" width="7" height="180" rx="3" fill="#2074b8"/><text x="72" y="236" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Assignment</text><text x="72" y="272" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Question and scope</text><text x="72" y="301" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Evidence-only rules</text><text x="72" y="330" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Required output fields</text><rect x="435" y="200" width="330" height="180" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="435" y="200" width="7" height="180" rx="3" fill="#2074b8"/><text x="457" y="236" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Candidate draft</text><text x="457" y="272" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Claims + source IDs</text><text x="457" y="301" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Recommendation</text><text x="457" y="330" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Explicit unknowns</text><rect x="820" y="200" width="330" height="180" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="820" y="200" width="7" height="180" rx="3" fill="#2074b8"/><text x="842" y="236" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Validation</text><text x="842" y="272" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Schema and references</text><text x="842" y="301" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Arithmetic and support</text><text x="842" y="330" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Return specific issues</text><rect x="270" y="470" width="660" height="135" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="270" y="470" width="7" height="135" rx="3" fill="#2074b8"/><text x="292" y="506" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Decision</text><text x="292" y="542" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Accept for review, revise within limits, or stop.</text><text x="292" y="571" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Valid JSON alone does not establish truth.</text><rect x="50" y="670" width="1100" height="58" rx="12" fill="#dfedfb"/><text x="72" y="707" fill="#164c7b" font-family="Arial,sans-serif" font-size="22">A source ID must exist AND support the claim being made.</text></svg>
