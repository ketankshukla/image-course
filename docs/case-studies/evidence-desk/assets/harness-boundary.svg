<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Put authority in code, not in a model's claim.</title><desc id="desc">Every tool proposal crosses a controlled boundary.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#3b82c4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#f4f9ff"/><text x="50" y="65" fill="#123b66" font-family="Arial,sans-serif" font-size="34" font-weight="700">Put authority in code, not in a model's claim.</text><text x="50" y="105" fill="#456581" font-family="Arial,sans-serif" font-size="21">Every tool proposal crosses a controlled boundary.</text><path d="M380 275H425" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 275H810" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M985 365V415H600V455" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="190" width="330" height="175" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="190" width="7" height="175" rx="3" fill="#2074b8"/><text x="72" y="226" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Model proposal</text><text x="72" y="262" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Tool name</text><text x="72" y="291" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Typed arguments</text><text x="72" y="320" fill="#29465e" font-family="Arial,sans-serif" font-size="21">No self-granted authority</text><rect x="435" y="190" width="330" height="175" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="435" y="190" width="7" height="175" rx="3" fill="#2074b8"/><text x="457" y="226" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Policy gateway</text><text x="457" y="262" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Validate and authorize</text><text x="457" y="291" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Check state and budget</text><text x="457" y="320" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Reject forbidden actions</text><rect x="820" y="190" width="330" height="175" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="820" y="190" width="7" height="175" rx="3" fill="#2074b8"/><text x="842" y="226" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Allowed tools</text><text x="842" y="262" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Search permitted sources</text><text x="842" y="291" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Calculate base cost</text><text x="842" y="320" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Save draft only</text><rect x="250" y="465" width="700" height="150" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="250" y="465" width="7" height="150" rx="3" fill="#2074b8"/><text x="272" y="501" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Run ledger</text><text x="272" y="537" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Record actual results, failures, versions and usage.</text><text x="272" y="566" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Separate human endpoint approves an exact draft.</text><rect x="50" y="670" width="1100" height="58" rx="12" fill="#dfedfb"/><text x="72" y="707" fill="#164c7b" font-family="Arial,sans-serif" font-size="22">No arbitrary shell, unrestricted URL fetching, purchases, or model-led publication.</text></svg>
