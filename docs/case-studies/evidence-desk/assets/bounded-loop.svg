y="170" width="7" height="160" rx="3" fill="#2074b8"/><text x="457" y="206" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Perform one step</text><text x="457" y="242" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Timeout each operation</text><text x="457" y="271" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Record its outcome</text><text x="457" y="300" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Checkpoint durable state</text><rect x="820" y="170" width="330" height="160" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="820" y="170" width="7" height="160" rx="3" fill="#2074b8"/><text x="842" y="206" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Verify result</text><text x="842" y="242" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Explicit acceptance rules</text><text x="842" y="271" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Classify the failure</text><text x="842" y="300" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Do not trust self-report</text><rect x="50" y="470" width="470" height="140" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="470" width="7" height="140" rx="3" fill="#2074b8"/><text x="72" y="506" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Revise or retry</text><text x="72" y="542" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Only if permitted and useful</text><text x="72" y="571" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Consume budget; recheck limits</text><rect x="680" y="470" width="470" height="140" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="680" y="470" width="7" height="140" rx="3" fill="#2074b8"/><text x="702" y="506" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Stop or pause</text><text x="702" y="542" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Needs review, unknown, cancelled,</text><text x="702" y="571" fill="#29465e" font-family="Arial,sans-serif" font-size="21">exhausted, failed, or complete</text><rect x="50" y="670" width="1100" height="58" rx="12" fill="#dfedfb"/><text x="72" y="707" fill="#164c7b" font-family="Arial,sans-serif" font-size="22">Missing evidence cannot be fixed by repeating a confident sentence.</text></svg>
