<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Build small working slices.</title><desc id="desc">Each stage adds one boundary that you can explain and test.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#3b82c4"/></marker></defs><rect width="1200" height="760" rx="24" fill="#f4f9ff"/><text x="50" y="65" fill="#123b66" font-family="Arial,sans-serif" font-size="34" font-weight="700">Build small working slices.</text><text x="50" y="105" fill="#456581" font-family="Arial,sans-serif" font-size="21">Each stage adds one boundary that you can explain and test.</text><path d="M380 255H425" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 255H810" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M985 335V400H600V445" fill="none" stroke="#3b82c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="170" width="330" height="165" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="50" y="170" width="7" height="165" rx="3" fill="#2074b8"/><text x="72" y="206" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">1–2  Foundations</text><text x="72" y="242" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Synthetic source packet</text><text x="72" y="271" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Schemas and pure functions</text><text x="72" y="300" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Permission and cost tests</text><rect x="435" y="170" width="330" height="165" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="435" y="170" width="7" height="165" rx="3" fill="#2074b8"/><text x="457" y="206" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">3–4  Local behavior</text><text x="457" y="242" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Fake model and graph</text><text x="457" y="271" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Bounded loop</text><text x="457" y="300" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Local Python API</text><rect x="820" y="170" width="330" height="165" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="820" y="170" width="7" height="165" rx="3" fill="#2074b8"/><text x="842" y="206" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">5–6  User experience</text><text x="842" y="242" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Next.js form and evidence</text><text x="842" y="271" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Real model adapter</text><text x="842" y="300" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Compare evaluation results</text><rect x="260" y="455" width="680" height="150" rx="14" fill="white" stroke="#b7d4ed" stroke-width="2"/><rect x="260" y="455" width="7" height="150" rx="3" fill="#2074b8"/><text x="282" y="491" fill="#164c7b" font-family="Arial,sans-serif" font-size="25" font-weight="700">7–8  Production responsibilities</text><text x="282" y="527" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Durable jobs, identity, recovery and approval binding</text><text x="282" y="556" fill="#29465e" font-family="Arial,sans-serif" font-size="21">Staging, release gates, monitoring and rollback</text><rect x="50" y="670" width="1100" height="58" rx="12" fill="#dfedfb"/><text x="72" y="707" fill="#164c7b" font-family="Arial,sans-serif" font-size="22">Keep the fake model: repeatable tests are valuable even after adding a real one.</text></svg>
