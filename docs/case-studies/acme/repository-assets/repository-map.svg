<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="title desc">
<title id="title">Three sibling repositories, not repositories inside image-course</title>
<desc id="desc">The existing learning repository stays separate from a Python and hybrid application repository and a later TypeScript application repository. Each application contains all five portfolio projects.</desc>
<rect width="1400" height="730" rx="24" fill="#09162b"/>
<g font-family="Arial, sans-serif" fill="#f1f7ff">
<text x="60" y="70" font-size="36" font-weight="bold">REPOSITORIES: WHERE THE CODE LIVES</text>
<text x="60" y="110" font-size="23" fill="#8db6dd">Sibling folders on your drive • independent Git histories</text>
<g fill="#102944" stroke="#3c91ce" stroke-width="2">
<rect x="50" y="160" width="410" height="420" rx="18"/>
<rect x="495" y="160" width="410" height="420" rx="18"/>
<rect x="940" y="160" width="410" height="420" rx="18"/>
</g>
<g font-size="27" font-weight="bold">
<text x="80" y="210">image-course</text>
<text x="525" y="210">acme-agent-platform</text>
<text x="970" y="210">acme-agent-platform-ts</text>
</g>
<g font-size="21" fill="#66ddd3">
<text x="80" y="250">EXISTING • LEARNING MATERIAL</text>
<text x="525" y="250">BUILD FIRST • PYTHON + WEB</text>
<text x="970" y="250">LATER • TYPESCRIPT</text>
</g>
<g font-size="24">
<text x="80" y="315">Courses and diagrams</text><text x="80" y="365">Architecture guides</text><text x="80" y="415">Course website</text><text x="80" y="465">One existing .git folder</text>
<text x="525" y="315">P1 MCP · P2 RAG · P3 A2A</text><text x="525" y="365">P4 Workflow · P5 Case UI</text><text x="525" y="415">Python backend + Next.js</text><text x="525" y="465">One new .git folder</text>
<text x="970" y="315">P1 MCP · P2 RAG · P3 A2A</text><text x="970" y="365">P4 Workflow · P5 Case UI</text><text x="970" y="415">TypeScript implementation</text><text x="970" y="465">One new .git folder</text>
</g>
<text x="80" y="540" font-size="21" fill="#8db6dd">Does not contain the app repos</text>
<text x="525" y="540" font-size="21" fill="#8db6dd">No nested Git repos for P1–P5</text>
<text x="970" y="540" font-size="21" fill="#8db6dd">No nested Git repos for P1–P5</text>
<text x="60" y="645" font-size="27" font-weight="bold">One repository can contain several independently deployed services.</text>
<text x="60" y="690" font-size="22" fill="#8db6dd">Proposed application names. Only image-course already exists in this plan.</text>
</g></svg>
