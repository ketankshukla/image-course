<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc"><title id="title">HOW TO BUILD ONE FEATURE</title><desc id="desc">Repeat this loop for every file and function. 1  CONTRACT, 2  FUNCTION, 3  TEST, 4  STORAGE, 5  ADAPTER, 6  FAILURE TEST, 7  CHECKPOINT.</desc><rect width="1440" height="660" rx="24" fill="#09162b"/><g font-family="Arial, sans-serif"><text x="55" y="75" fill="#f2f7ff" font-size="37" font-weight="bold">HOW TO BUILD ONE FEATURE</text><text x="55" y="120" fill="#9dbad9" font-size="24">Repeat this loop for every file and function.</text><rect x="55" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="75" y="233" font-size="26" font-weight="bold" fill="#fff">1  CONTRACT</text><text x="75" y="277" font-size="23" fill="#72e0cb">Define inputs</text><text x="370" y="265" font-size="28" fill="#54d8e9">→</text><rect x="400" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="420" y="233" font-size="26" font-weight="bold" fill="#fff">2  FUNCTION</text><text x="420" y="277" font-size="23" fill="#72e0cb">Write the rule</text><text x="715" y="265" font-size="28" fill="#54d8e9">→</text><rect x="745" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="765" y="233" font-size="26" font-weight="bold" fill="#fff">3  TEST</text><text x="765" y="277" font-size="23" fill="#72e0cb">Prove the result</text><text x="1060" y="265" font-size="28" fill="#54d8e9">→</text><rect x="1090" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="1110" y="233" font-size="26" font-weight="bold" fill="#fff">4  STORAGE</text><text x="1110" y="277" font-size="23" fill="#72e0cb">Persist safely</text><rect x="55" y="395" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="75" y="443" font-size="26" font-weight="bold" fill="#fff">5  ADAPTER</text><text x="75" y="487" font-size="23" fill="#72e0cb">Expose the boundary</text><text x="370" y="475" font-size="28" fill="#54d8e9">→</text><rect x="400" y="395" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="420" y="443" font-size="26" font-weight="bold" fill="#fff">6  FAILURE TEST</text><text x="420" y="487" font-size="23" fill="#72e0cb">Break an assumption</text><text x="715" y="475" font-size="28" fill="#54d8e9">→</text><rect x="745" y="395" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="765" y="443" font-size="26" font-weight="bold" fill="#fff">7  CHECKPOINT</text><text x="765" y="487" font-size="23" fill="#72e0cb">Explain + commit</text><text x="1110" y="425" font-size="23" fill="#9dbad9">Read 1–4, then 5–7.</text><text x="55" y="605" font-size="25" fill="#f2f7ff">A passing checkpoint is evidence, not just a completed file.</text></g></svg>
