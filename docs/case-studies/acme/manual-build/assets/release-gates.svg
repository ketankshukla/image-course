<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc"><title id="title">FROM YOUR COMPUTER TO A SAFE DEMO</title><desc id="desc">Do not skip a gate because the home page loads. 1  LOCK, 2  BUILD, 3  INTEGRATE, 4  ISOLATE, 5  RELEASE, 6  VERIFY, 7  OPERATE.</desc><rect width="1440" height="660" rx="24" fill="#09162b"/><g font-family="Arial, sans-serif"><text x="55" y="75" fill="#f2f7ff" font-size="37" font-weight="bold">FROM YOUR COMPUTER TO A SAFE DEMO</text><text x="55" y="120" fill="#9dbad9" font-size="24">Do not skip a gate because the home page loads.</text><rect x="55" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="75" y="233" font-size="26" font-weight="bold" fill="#fff">1  LOCK</text><text x="75" y="277" font-size="23" fill="#72e0cb">Versions + fixtures</text><text x="370" y="265" font-size="28" fill="#54d8e9">→</text><rect x="400" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="420" y="233" font-size="26" font-weight="bold" fill="#fff">2  BUILD</text><text x="420" y="277" font-size="23" fill="#72e0cb">Tests + artifacts</text><text x="715" y="265" font-size="28" fill="#54d8e9">→</text><rect x="745" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="765" y="233" font-size="26" font-weight="bold" fill="#fff">3  INTEGRATE</text><text x="765" y="277" font-size="23" fill="#72e0cb">Complete case</text><text x="1060" y="265" font-size="28" fill="#54d8e9">→</text><rect x="1090" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="1110" y="233" font-size="26" font-weight="bold" fill="#fff">4  ISOLATE</text><text x="1110" y="277" font-size="23" fill="#72e0cb">Secrets + data</text><rect x="55" y="395" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="75" y="443" font-size="26" font-weight="bold" fill="#fff">5  RELEASE</text><text x="75" y="487" font-size="23" fill="#72e0cb">Compatible services</text><text x="370" y="475" font-size="28" fill="#54d8e9">→</text><rect x="400" y="395" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="420" y="443" font-size="26" font-weight="bold" fill="#fff">6  VERIFY</text><text x="420" y="487" font-size="23" fill="#72e0cb">Receipt + recovery</text><text x="715" y="475" font-size="28" fill="#54d8e9">→</text><rect x="745" y="395" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="765" y="443" font-size="26" font-weight="bold" fill="#fff">7  OPERATE</text><text x="765" y="487" font-size="23" fill="#72e0cb">Alerts + restore</text><text x="1110" y="425" font-size="23" fill="#9dbad9">Read 1–4, then 5–7.</text><text x="55" y="605" font-size="25" fill="#f2f7ff">A passing checkpoint is evidence, not just a completed file.</text></g></svg>
