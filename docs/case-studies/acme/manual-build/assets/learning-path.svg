<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc"><title id="title">YOUR MANUAL BUILD PATH</title><desc id="desc">Each stage leaves something small that you can run and explain. 1  FOUNDATIONS, 2  MCP TOOLS, 3  RAG EVIDENCE, 4  A2A AGENTS, 5  WORKFLOW, 6  CASE UI, 7  PRODUCTION.</desc><rect width="1440" height="660" rx="24" fill="#09162b"/><g font-family="Arial, sans-serif"><text x="55" y="75" fill="#f2f7ff" font-size="37" font-weight="bold">YOUR MANUAL BUILD PATH</text><text x="55" y="120" fill="#9dbad9" font-size="24">Each stage leaves something small that you can run and explain.</text><rect x="55" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="75" y="233" font-size="26" font-weight="bold" fill="#fff">1  FOUNDATIONS</text><text x="75" y="277" font-size="23" fill="#72e0cb">Package + tests</text><text x="370" y="265" font-size="28" fill="#54d8e9">→</text><rect x="400" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="420" y="233" font-size="26" font-weight="bold" fill="#fff">2  MCP TOOLS</text><text x="420" y="277" font-size="23" fill="#72e0cb">Safe transactions</text><text x="715" y="265" font-size="28" fill="#54d8e9">→</text><rect x="745" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="765" y="233" font-size="26" font-weight="bold" fill="#fff">3  RAG EVIDENCE</text><text x="765" y="277" font-size="23" fill="#72e0cb">Sources + citations</text><text x="1060" y="265" font-size="28" fill="#54d8e9">→</text><rect x="1090" y="185" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="1110" y="233" font-size="26" font-weight="bold" fill="#fff">4  A2A AGENTS</text><text x="1110" y="277" font-size="23" fill="#72e0cb">Tasks + artifacts</text><rect x="55" y="395" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="75" y="443" font-size="26" font-weight="bold" fill="#fff">5  WORKFLOW</text><text x="75" y="487" font-size="23" fill="#72e0cb">Approval + recovery</text><text x="370" y="475" font-size="28" fill="#54d8e9">→</text><rect x="400" y="395" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="420" y="443" font-size="26" font-weight="bold" fill="#fff">6  CASE UI</text><text x="420" y="487" font-size="23" fill="#72e0cb">Understandable controls</text><text x="715" y="475" font-size="28" fill="#54d8e9">→</text><rect x="745" y="395" width="310" height="135" rx="16" fill="#112e4d" stroke="#4dc8dd" stroke-width="2"/><text x="765" y="443" font-size="26" font-weight="bold" fill="#fff">7  PRODUCTION</text><text x="765" y="487" font-size="23" fill="#72e0cb">Operate + restore</text><text x="1110" y="425" font-size="23" fill="#9dbad9">Read 1–4, then 5–7.</text><text x="55" y="605" font-size="25" fill="#f2f7ff">A passing checkpoint is evidence, not just a completed file.</text></g></svg>
