<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Four different jobs, not four names for the same thing</title><desc id="desc">RAG finds evidence. A2A delegates tasks. MCP exposes tools. The workflow coordinates the whole case.</desc><rect width="1440" height="800" rx="24" fill="#09162b"/><g font-family="Arial, sans-serif"><text x="55" y="76" font-size="37" fill="#fff" font-weight="bold">FOUR DIFFERENT JOBS</text><text x="55" y="123" font-size="24" fill="#a8c1dc">The librarian, the assignment system, the toolbox, and the case manager.</text><rect x="55" y="180" width="635" height="210" rx="18" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="80" y="235" font-size="36" fill="#77e2cc" font-weight="bold">RAG</text><text x="80" y="288" font-size="26" fill="#fff">Find the supporting information.</text><text x="80" y="340" font-size="23" fill="#bad0e5">Which policy passage applies?</text><rect x="745" y="180" width="635" height="210" rx="18" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="770" y="235" font-size="36" fill="#77e2cc" font-weight="bold">A2A</text><text x="770" y="288" font-size="26" fill="#fff">Pass bounded work to specialists.</text><text x="770" y="340" font-size="23" fill="#bad0e5">Policy and Finance: examine this case.</text><rect x="55" y="435" width="635" height="210" rx="18" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="80" y="490" font-size="36" fill="#77e2cc" font-weight="bold">MCP</text><text x="80" y="543" font-size="26" fill="#fff">Offer a standard way to call tools.</text><text x="80" y="595" font-size="23" fill="#bad0e5">Look up an account; request an approved credit.</text><rect x="745" y="435" width="635" height="210" rx="18" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="770" y="490" font-size="36" fill="#77e2cc" font-weight="bold">WORKFLOW</text><text x="770" y="543" font-size="26" fill="#fff">Remember and coordinate the whole job.</text><text x="770" y="595" font-size="23" fill="#bad0e5">What is done? What should happen next?</text><text x="55" y="733" font-size="25" fill="#fff">Business rules and the database decide whether an action actually commits.</text></g></svg>
