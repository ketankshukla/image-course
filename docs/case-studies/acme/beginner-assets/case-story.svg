<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc"><title id="title">One customer case, from request to receipt</title><desc id="desc">Read the nine numbered steps left to right across each row. Persisted progress and duplicate protection support the whole journey.</desc><rect width="1440" height="940" rx="24" fill="#09162b"/><g font-family="Arial, sans-serif"><text x="55" y="73" font-size="38" fill="#fff" font-weight="bold">ONE CASE, FROM REQUEST TO RECEIPT</text><text x="55" y="121" font-size="23" fill="#a8c1dc">A $120 dispute → evidence and review → an approved $75 simulated credit</text><rect x="55" y="175" width="410" height="155" rx="16" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="77" y="213" font-size="20" fill="#76dfcb">01</text><text x="77" y="257" font-size="27" font-weight="bold" fill="#fff">Maya submits</text><text x="77" y="298" font-size="22" fill="#bad0e5">A person asks for help.</text><text x="471" y="267" font-size="32" fill="#60d2e6">→</text><rect x="515" y="175" width="410" height="155" rx="16" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="537" y="213" font-size="20" fill="#76dfcb">02</text><text x="537" y="257" font-size="27" font-weight="bold" fill="#fff">Record the case</text><text x="537" y="298" font-size="22" fill="#bad0e5">Save the request and next job.</text><text x="931" y="267" font-size="32" fill="#60d2e6">→</text><rect x="975" y="175" width="410" height="155" rx="16" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="997" y="213" font-size="20" fill="#76dfcb">03</text><text x="997" y="257" font-size="27" font-weight="bold" fill="#fff">Look up the facts</text><text x="997" y="298" font-size="22" fill="#bad0e5">MCP account-read tool.</text><rect x="55" y="380" width="410" height="155" rx="16" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="77" y="418" font-size="20" fill="#76dfcb">04</text><text x="77" y="462" font-size="27" font-weight="bold" fill="#fff">Find the policy</text><text x="77" y="503" font-size="22" fill="#bad0e5">RAG returns source evidence.</text><text x="471" y="472" font-size="32" fill="#60d2e6">→</text><rect x="515" y="380" width="410" height="155" rx="16" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="537" y="418" font-size="20" fill="#76dfcb">05</text><text x="537" y="462" font-size="27" font-weight="bold" fill="#fff">Ask the specialists</text><text x="537" y="503" font-size="22" fill="#bad0e5">A2A tasks: Policy and Finance.</text><text x="931" y="472" font-size="32" fill="#60d2e6">→</text><rect x="975" y="380" width="410" height="155" rx="16" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="997" y="418" font-size="20" fill="#76dfcb">06</text><text x="997" y="462" font-size="27" font-weight="bold" fill="#fff">Prepare the proposal</text><text x="997" y="503" font-size="22" fill="#bad0e5">Recommend an exact $75 credit.</text><rect x="55" y="585" width="410" height="155" rx="16" fill="#112e4d" stroke="#f2bc73" stroke-width="2"/><text x="77" y="623" font-size="20" fill="#76dfcb">07</text><text x="77" y="667" font-size="27" font-weight="bold" fill="#fff">Get human approval</text><text x="77" y="708" font-size="22" fill="#bad0e5">Maya approves this version.</text><text x="471" y="677" font-size="32" fill="#60d2e6">→</text><rect x="515" y="585" width="410" height="155" rx="16" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="537" y="623" font-size="20" fill="#76dfcb">08</text><text x="537" y="667" font-size="27" font-weight="bold" fill="#fff">Record the credit</text><text x="537" y="708" font-size="22" fill="#bad0e5">MCP → checked transaction.</text><text x="931" y="677" font-size="32" fill="#60d2e6">→</text><rect x="975" y="585" width="410" height="155" rx="16" fill="#112e4d" stroke="#50c8dd" stroke-width="2"/><text x="997" y="623" font-size="20" fill="#76dfcb">09</text><text x="997" y="667" font-size="27" font-weight="bold" fill="#fff">Show the receipt</text><text x="997" y="708" font-size="22" fill="#bad0e5">Confirm $75 credit; $45 remains.</text><text x="55" y="836" font-size="24" fill="#fff">Read 01–03, then 04–06, then 07–09. Problems can pause the process.</text><text x="55" y="889" font-size="23" fill="#79dfd2">Behind every step: permission checks, saved progress, and safe recovery.</text></g></svg>
