<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
$for(css)$<link rel="stylesheet" href="$css$">$endfor$
</head>
<body>
<a class="skip" href="#content">Skip to document</a>
<aside aria-label="Document contents">
<div class="brand">Visual learning library</div>
<h2>$edition$</h2>
$toc$
<div class="rail-footer">Self-contained reading edition<br>Diagrams and styles embedded</div>
</aside>
<main id="content">
<div class="toolbar"><span>Illustrated reference guide</span><button type="button" onclick="window.print()">Print / Save PDF</button></div>
$body$
</main>
<dialog id="diagram-dialog" aria-label="Enlarged diagram">
<div class="zoom-toolbar"><span>Diagram detail</span><button type="button" id="diagram-close">Close</button></div>
<div class="zoom-body"><img id="diagram-large" alt=""></div>
</dialog>
<script>
const diagramDialog = document.getElementById('diagram-dialog');
const diagramLarge = document.getElementById('diagram-large');
document.querySelectorAll('main img').forEach((picture) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'diagram-button';
  button.textContent = 'Enlarge diagram';
  button.addEventListener('click', () => {
    diagramLarge.src = picture.src;
    diagramLarge.alt = picture.alt;
    diagramDialog.showModal();
  });
  picture.insertAdjacentElement('afterend', button);
});
document.getElementById('diagram-close').addEventListener('click', () => diagramDialog.close());
</script>
</body>
</html>
