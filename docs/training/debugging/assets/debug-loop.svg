<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><rect width="1200" height="610" rx="24" fill="#edf4ff"/><g font-family="Segoe UI,Arial,sans-serif" fill="#173964"><text x="45" y="65" font-size="36" font-weight="700">Debugging is a sequence of small experiments.</text><g font-size="26"><text x="50" y="145">1 · Reproduce</text><text x="445" y="145">2 · Locate the boundary</text><text x="855" y="145">3 · Predict a cause</text><text x="50" y="365">4 · Test one prediction</text><text x="445" y="365">5 · Make a small fix</text><text x="855" y="365">6 · Prove it stays fixed</text></g><g font-size="23"><text x="50" y="195">Same input, same failure.</text><text x="445" y="195">Where does correct data</text><text x="445" y="230">first become incorrect?</text><text x="855" y="195">Write down what you</text><text x="855" y="230">expect to observe.</text><text x="50" y="415">Change one variable.</text><text x="445" y="415">Repair the cause, not</text><text x="445" y="450">just the visible symptom.</text><text x="855" y="415">Repeat the reproduction</text><text x="855" y="450">and add a regression test.</text></g><text x="50" y="555" font-size="26">Prediction wrong? Keep the evidence, discard the hypothesis, and try again.</text></g><g stroke="#245ac4" stroke-width="4" fill="none"><path d="M345 165h70m-15 -10l15 10 -15 10M760 165h65m-15 -10l15 10 -15 10M1000 250v35H170v40m-10 -15l10 15 10 -15M345 390h70m-15 -10l15 10 -15 10M760 390h65m-15 -10l15 10 -15 10"/></g></svg>
