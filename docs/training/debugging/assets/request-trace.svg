<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="24" fill="#edf4ff"/><g font-family="Segoe UI,Arial,sans-serif" fill="#173964"><text x="50" y="65" font-size="36" font-weight="700">Follow the request. Find the first wrong value.</text></g><g fill="white" stroke="#b8cfed" stroke-width="2"><rect x="50" y="115" width="1100" height="100" rx="15"/><rect x="50" y="255" width="1100" height="100" rx="15"/><rect x="50" y="395" width="1100" height="100" rx="15"/><rect x="50" y="535" width="1100" height="110" rx="15"/></g><g font-family="Segoe UI,Arial,sans-serif" fill="#173964" font-size="25"><text x="80" y="155" font-weight="700">Browser: user types FilePilot</text><text x="80" y="192">The request correctly includes q=FilePilot and limit=10.</text><text x="80" y="295" font-weight="700">HTTP handler: reads the query</text><text x="80" y="332">The input is still FilePilot. The network did not lose it.</text><text x="80" y="435" font-weight="700">Search function: compares different letter cases</text><text x="80" y="472">filepilot.includes(FilePilot) is false. This is the first incorrect decision.</text><text x="80" y="575" font-weight="700">Response and screen: faithfully display an empty list</text><text x="80" y="612">HTTP 200 means the request succeeded—not that the answer is correct.</text></g><g stroke="#245ac4" stroke-width="4"><path d="M600 220v30m-10 -12l10 12 10 -12M600 360v30m-10 -12l10 12 10 -12M600 500v30m-10 -12l10 12 10 -12"/></g></svg>
