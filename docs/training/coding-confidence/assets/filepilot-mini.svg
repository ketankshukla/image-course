<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">Proposed FilePilot Mini learning architecture</title><desc id="desc">Fictional metadata passes through validation and planning to a preview. A later approved plan reaches a disposable sandbox executor and a recovery journal. Rejected plans do not execute.</desc>
<rect width="1200" height="880" rx="24" fill="#edf4fb"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#174d79"><text x="50" y="65" font-size="38" font-weight="700">Plan first. Act only within a safe boundary.</text><text x="50" y="110" font-size="25">Proposed course project — not an already implemented application</text>
<g fill="white" stroke="#bad4e9" stroke-width="2"><rect x="50" y="155" width="325" height="170" rx="16"/><rect x="437" y="155" width="325" height="170" rx="16"/><rect x="825" y="155" width="325" height="170" rx="16"/></g>
<g font-size="28" font-weight="700"><text x="75" y="203">Fictional records</text><text x="462" y="203">Validate + plan</text><text x="850" y="203">Read-only preview</text></g><g font-size="24"><text x="75" y="250">Names and stable IDs.</text><text x="75" y="290">No personal folders.</text><text x="462" y="250">Reject invalid input.</text><text x="462" y="290">Detect collisions.</text><text x="850" y="250">Show exact proposals.</text><text x="850" y="290">Explain each choice.</text></g>
<rect x="50" y="395" width="1100" height="400" rx="18" fill="#dcecff" stroke="#3683ba" stroke-width="2" stroke-dasharray="10 7"/><text x="75" y="442" font-size="27" font-weight="700">LATER MODULES: disposable practice folder only</text>
<g fill="white" stroke="#bad4e9" stroke-width="2"><rect x="825" y="490" width="300" height="175" rx="15"/><rect x="440" y="490" width="300" height="175" rx="15"/><rect x="75" y="490" width="300" height="175" rx="15"/></g>
<g font-size="27" font-weight="700"><text x="850" y="536">Approve this plan</text><text x="465" y="536">Sandbox executor</text><text x="100" y="536">Journal + undo</text></g><g font-size="24"><text x="850" y="581">Not a blanket yes.</text><text x="850" y="625">Recheck changed files.</text><text x="465" y="581">Stay inside the root.</text><text x="465" y="625">Never overwrite.</text><text x="100" y="581">Record completed work.</text><text x="100" y="625">Refuse undo conflicts.</text></g><text x="75" y="740" font-size="26" font-weight="700">Denied, stale, or conflicting plan? Stop. Explain. Do not execute.</text><text x="50" y="841" font-size="24">Planning is a decision. Execution is a side effect. Keep them separate.</text></g>
<g stroke="#3683ba" stroke-width="4" fill="none"><path d="M385 240h40m-12-10 12 10-12 10M772 240h40m-12-10 12 10-12 10M980 335v45m-10-12 10 12 10-12M813 575h-60m12-10-12 10 12 10M428 575h-40m12-10-12 10 12 10"/></g></svg>
