<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">Four review gates before release</title><desc id="desc">Check structure, implementation, behavior, and evidence. An unmet requirement returns the change for revision. Release requires acceptance and a recovery plan, not just a successful build.</desc>
<rect width="1200" height="830" rx="24" fill="#edf4fb"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#174d79"><text x="50" y="65" font-size="38" font-weight="700">A green build is not the finish line</text><text x="50" y="112" font-size="25">Ask four different questions before accepting a change.</text>
<g fill="white" stroke="#bad4e9" stroke-width="2"><rect x="50" y="160" width="520" height="200" rx="16"/><rect x="630" y="160" width="520" height="200" rx="16"/><rect x="630" y="420" width="520" height="200" rx="16"/><rect x="50" y="420" width="520" height="200" rx="16"/></g>
<g font-size="30" font-weight="700"><text x="75" y="210">1. Structure</text><text x="655" y="210">2. Implementation</text><text x="655" y="470">3. Behavior</text><text x="75" y="470">4. Evidence</text></g>
<g font-size="26"><text x="75" y="270">Are responsibilities separated?</text><text x="75" y="313">Can preview accidentally act?</text><text x="655" y="270">Is the code understandable?</text><text x="655" y="313">Are assumptions visible?</text><text x="655" y="530">What if a file has changed?</text><text x="655" y="573">What if the destination exists?</text><text x="75" y="530">Would tests catch a broken rule?</text><text x="75" y="573">What did we actually run?</text></g>
<rect x="50" y="674" width="1100" height="110" rx="16" fill="#dcecff"/><text x="75" y="718" font-size="27" font-weight="700">Unmet requirement → revise and retest</text><text x="75" y="757" font-size="26">Accepted behavior + configured release gate + recovery plan → release</text></g>
<g stroke="#3683ba" stroke-width="4" fill="none"><path d="M580 260h40m-12-10 12 10-12 10M890 370v40m-10-12 10 12 10-12M620 520h-40m12-10-12 10 12 10M310 630v33m-10-12 10 12 10-12"/></g></svg>
