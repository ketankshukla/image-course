<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-label="Git Collaboration and Code Review flow"><rect width="1200" height="790" rx="24" fill="#edf4ff"/><g font-family="Segoe UI,Arial,sans-serif" fill="#173964"><text x="50" y="60" font-size="32" font-weight="700">Git Collaboration and Code Review</text><rect x="50" y="155" width="520" height="195" rx="18" fill="white" stroke="#b8cfed" stroke-width="2"/><text x="75" y="197" font-size="25" font-weight="700">1 · Separate contributions</text><text x="75" y="268" font-size="23">Reviewer requirement and evidence</text><text x="75" y="300" font-size="23">requirement</text><rect x="630" y="155" width="520" height="195" rx="18" fill="white" stroke="#b8cfed" stroke-width="2"/><text x="655" y="197" font-size="25" font-weight="700">2 · Inspect the conflict</text><text x="655" y="268" font-size="23">Read both changes and their intended</text><text x="655" y="300" font-size="23">meaning</text><rect x="50" y="415" width="520" height="195" rx="18" fill="white" stroke="#b8cfed" stroke-width="2"/><text x="75" y="457" font-size="25" font-weight="700">3 · Combine requirements</text><text x="75" y="528" font-size="23">Resolve deliberately; inspect the</text><text x="75" y="560" font-size="23">staged diff</text><rect x="630" y="415" width="520" height="195" rx="18" fill="white" stroke="#b8cfed" stroke-width="2"/><text x="655" y="457" font-size="25" font-weight="700">4 · Review and recover</text><text x="655" y="528" font-size="23">Verify history and rehearse a new</text><text x="655" y="560" font-size="23">revert commit</text><rect x="50" y="660" width="1100" height="95" rx="15" fill="#dae8ff"/><text x="75" y="696" font-size="23">Disposable local repository; no real PR, reviewer, remote, or push.</text></g><g fill="none" stroke="#245ac4" stroke-width="3"><path d="M575 250h40m-12 -9l12 9 -12 9M890 355v25H310v25m-9 -12l9 12 9 -12M575 510h40m-12 -9l12 9 -12 9"/></g></svg>