<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">One release controller and two isolated practice destinations</title><desc id="desc">GitHub verifies the same commit, deploys to the staging Vercel project, then waits for approval before deploying to the production practice project. Each has separate GitHub environment secrets. The real course website is untouched.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#245ac4"/></marker></defs>
<rect width="1200" height="800" rx="24" fill="#f0f6ff"/><g font-family="Segoe UI,Arial,sans-serif" fill="#173964"><text x="50" y="65" font-size="36" font-weight="700">One controlled route to each practice site.</text><text x="50" y="108" font-size="24">Separate project IDs · separate secrets · same source commit</text></g>
<rect x="50" y="150" width="1100" height="145" rx="18" fill="#173964"/><g font-family="Segoe UI,Arial,sans-serif" fill="white"><text x="80" y="198" font-size="29" font-weight="700">GitHub Actions · manual release from main</text><text x="80" y="245" font-size="25">verify → staging → required human approval → production</text></g>
<g fill="none" stroke="#245ac4" stroke-width="3" marker-end="url(#arrow)"><path d="M310 300V360"/><path d="M890 300V360"/></g>
<g fill="white" stroke="#bad0f0" stroke-width="2"><rect x="50" y="375" width="530" height="265" rx="18"/><rect x="620" y="375" width="530" height="265" rx="18"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173964" font-size="25"><g font-weight="700"><text x="80" y="426">release-lab-staging</text><text x="650" y="426">release-lab-production</text></g><text x="80" y="475">GitHub environment: staging</text><text x="80" y="520">Vercel target: Production</text><text x="80" y="565">Purpose: rehearsal, synthetic data</text><text x="80" y="608">No independent Git auto-deploy</text><text x="650" y="475">GitHub environment: production</text><text x="650" y="520">Vercel target: Production</text><text x="650" y="565">Purpose: practice public release</text><text x="650" y="608">No independent Git auto-deploy</text></g>
<rect x="50" y="685" width="1100" height="72" rx="14" fill="#dceaff"/><text x="80" y="732" font-family="Segoe UI,Arial,sans-serif" fill="#173964" font-size="25">Your real image-course project and its production domain remain outside this lab.</text>
</svg>
