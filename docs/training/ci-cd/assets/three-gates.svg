<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Why unfinished code can still compile</title><desc id="desc">Compilation passes for returning every lesson. Acceptance tests fail because the selected category is ignored. Human review also checks keyboard access and actual browser behavior.</desc>
<rect width="1200" height="700" rx="24" fill="#eff6ff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173964"><text x="50" y="65" font-size="36" font-weight="700">Three checks. Three different promises.</text><text x="50" y="108" font-size="24">Example: “Case studies only” still shows every lesson.</text></g>
<g fill="white" stroke="#bad0f0" stroke-width="2"><rect x="50" y="155" width="350" height="380" rx="18"/><rect x="425" y="155" width="350" height="380" rx="18"/><rect x="800" y="155" width="350" height="380" rx="18"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173964" font-size="24"><g font-size="29" font-weight="700"><text x="75" y="205">Compiler</text><text x="450" y="205">Acceptance tests</text><text x="825" y="205">Human review</text></g><text x="75" y="259">Are types and syntax valid?</text><text x="75" y="309">Returns a lesson array.</text><text x="75" y="345">The type promise is met.</text><text x="450" y="259">Are the results correct?</text><text x="450" y="309">Expected: 2 case studies.</text><text x="450" y="345">Actual: all 3 lessons.</text><text x="825" y="259">Does the experience work?</text><text x="825" y="309">Use the real dropdown.</text><text x="825" y="345">Check keyboard access.</text><g font-weight="700"><text x="75" y="460">BUILD PASSES</text><text x="450" y="460">TESTS FAIL</text><text x="825" y="460">REJECT IF INCOMPLETE</text></g></g>
<rect x="50" y="580" width="1100" height="72" rx="14" fill="#dceaff"/><text x="76" y="625" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#173964">Automation can enforce the requirements you encode—not the ones you forgot.</text>
</svg>
