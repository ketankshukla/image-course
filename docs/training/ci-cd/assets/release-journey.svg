<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">From a feature idea to a controlled release</title><desc id="desc">Requirements become code on a branch. Tests and peer review gate merging. Staging and approval gate production. A rejected candidate stays out of production.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#245ac4"/></marker></defs>
<rect width="1200" height="780" rx="24" fill="#f0f6ff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173964"><text x="55" y="65" font-size="36" font-weight="700">Every gate asks a different question.</text><text x="55" y="107" font-size="24">A working build is the beginning of the evidence, not the end.</text></g>
<g fill="white" stroke="#bad0f0" stroke-width="2"><rect x="55" y="150" width="315" height="170" rx="16"/><rect x="440" y="150" width="315" height="170" rx="16"/><rect x="825" y="150" width="320" height="170" rx="16"/><rect x="55" y="430" width="315" height="170" rx="16"/><rect x="440" y="430" width="315" height="170" rx="16"/><rect x="825" y="430" width="320" height="170" rx="16"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173964" font-size="25"><g font-weight="700"><text x="80" y="193">1 · Define the feature</text><text x="465" y="193">2 · Branch + PR</text><text x="850" y="193">3 · Test + review</text><text x="80" y="473">4 · Merge + staging</text><text x="465" y="473">5 · Release approval</text><text x="850" y="473">6 · Production</text></g><g font-size="23"><text x="80" y="240">What must the learner</text><text x="80" y="274">be able to do?</text><text x="465" y="240">What changed, and</text><text x="465" y="274">why should we accept it?</text><text x="850" y="240">Does the implementation</text><text x="850" y="274">meet the promise?</text><text x="80" y="520">Does this exact candidate</text><text x="80" y="554">work in rehearsal?</text><text x="465" y="520">Is the evidence sufficient</text><text x="465" y="554">to release this now?</text><text x="850" y="520">Are real users getting</text><text x="850" y="554">the expected result?</text></g></g>
<g fill="none" stroke="#245ac4" stroke-width="3" marker-end="url(#arrow)"><path d="M375 235H426"/><path d="M760 235H811"/><path d="M985 330V370H212V415"/><path d="M375 515H426"/><path d="M760 515H811"/></g>
<rect x="55" y="650" width="1090" height="82" rx="14" fill="#dceaff"/><text x="80" y="699" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#173964">Failed test or rejected approval → fix the candidate; do not bypass the gate.</text>
</svg>
